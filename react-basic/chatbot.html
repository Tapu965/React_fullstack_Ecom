<!DOCTYPE html>
<html>
  <head>
    <title>chatbot</title>
    <style>
      body{
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .send-button{
        background-color:rgb(25,135,84);
        border-radius: 10px;
        color:white;
        padding:12px 20px;
        border:none;
        margin-left: 10px;
        font-size: 15px;
        cursor: pointer;
      }
      .chat-input{
        padding:12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
         flex-grow:1;
       
      }
      .chat-input-container{
        display:flex;
        margin-bottom: 60px;
        
      }
      .app-container{
        max-width: 600px;
        margin-left:auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
        

      }
      .chat-massage-user{
        display:flex;
        justify-content: end;
        margin-top: 10px;
        align-items: start;

      }
      .chat-massage-robot{
        display:flex;
        align-items: start;
      }
      .chat-massage-text{
        background-color: rgb(238,238,238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;

      }
      .chat-massage-profile{
        width:45px;
      }
      .chat-massages-container{
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width:none;
        
      }

    </style>
  </head>
 
  <body>
    <div class="js-container"></div>
     <script>
    console.log("hello0");
  </script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({chatMassages, setChatMassages}){
           const [inputText, setInputText]=React.useState('');
        function saveInputText(event){
          
          setInputText(event.target.value);
        }
        function sendMassage(){
            const newChatMassages=[
              ...chatMassages,
              {
                massage:inputText,
                sender:'user',
                id:crypto.randomUUID()

              }
            ];
            setChatMassages(newChatMassages);

            const response=Chatbot.getResponse(inputText);
               setChatMassages([
              ...newChatMassages,
              {
                massage:response,
                sender:'robot',
                id:crypto.randomUUID()

              }
            ]);

            setInputText('');

        }
        return (
        <div className="chat-input-container">
          <input 
            placeholder="Type your message here..." 
            size="30"
            onChange={saveInputText}
            value={inputText}
            className="chat-input"
          />
            <button 
            onClick={sendMassage}
            className="send-button"
            >Send</button>
        </div>
        );
      }
      function ChatMassage({massage,sender}){
        // const massage=props.massage;
        // const sender=props.sender;
        //const{massage,sender}=props;


        // if(sender=="robot"){
        //   return(
        //     <div>
             
        //       <img src="robot.png" width={50}/>
        //        {massage}
        //     </div>

        //   );
        // }
        return(
          <div className={
            sender==='user'
            ?'chat-massage-user'
            :'chat-massage-robot'}>
            {sender==='robot'&& (
              <img src="robot.png" className="chat-massage-profile"/>
            )}
            <div className="chat-massage-text">
           {massage}
           </div>
           {sender==='user'&&
           (<img src="user.png" className="chat-massage-profile"/>

           )}
          </div>
        );
      }
      function ChatMassages({chatMassages}){
        const chatMassagesRef=React.useRef(null);
       React.useEffect(()=>{
       const containerElem= chatMassagesRef.current
       if(containerElem){
        containerElem.scrollTop=containerElem.scrollHeight;
       }
        

       }, [chatMassages]);
          return(
            <div className="chat-massages-container"
            ref={chatMassagesRef}>
            
              {chatMassages.map((chatMassages) =>{
                return(
                  <ChatMassage 
                    massage={chatMassages.massage}
                    sender={chatMassages.sender}
                    key={chatMassages.id}
                  />
                );
              })}
            </div>
          );
      }
      function App(){
           const [chatMassages, setChatMassages]=React.useState([{
            massage:'hello chatbot',
            sender:'user',
            id:"id1"
          },{
            massage:'hello! how can i help you?',
            sender:'robot',
            id:"id2"
          },{
            massage:"can you tell me today's date?",
            sender:'user',
            id:"id3"
          },{
            massage:"Sure! Today is 2026-06-01",
            sender:'robot',
            id:"id4"
          }]); 
        //  const [chatMassages, setChatMassages]=array;
        //   const chatMassages=array[0];
        //  const setChatMassages=array[1];


        return(
          <div className="app-container">

           
            <ChatMassages 
            chatMassages={chatMassages}
            // setChatMassages={setChatMassages}

            
            />
            <ChatInput 
           chatMassages={chatMassages}
           setChatMassages={setChatMassages}
           />
            </div>

          );
      }
        
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
